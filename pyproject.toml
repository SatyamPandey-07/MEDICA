[project]
name = "medica-workspace"
version = "2.0.0"
description = "Autonomous Oncology Intelligence Operating System & Ingestion Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Ingestion Agent Core
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    
    # MEDICA Backend Core
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.6",
    "pgvector>=0.2.0",
    "structlog>=23.1.0",
    "colorama>=0.4.6",
    "apscheduler>=3.10.1",
    "pytz>=2023.3",
    "sentence-transformers>=2.2.2",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
start = "ingestion_agent.app.main:run"
sync = "ingestion_agent.scripts.fetch_once:run_sync"
clean = "ingestion_agent.scripts.clean_reset:run_reset"

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
