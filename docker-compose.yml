version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: medica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medica_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medica} -d ${POSTGRES_DB:-medica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medica-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medica}:${POSTGRES_PASSWORD:-medica_secret}@db:5432/${POSTGRES_DB:-medica}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-medica}:${POSTGRES_PASSWORD:-medica_secret}@db:5432/${POSTGRES_DB:-medica}
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: medica-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
